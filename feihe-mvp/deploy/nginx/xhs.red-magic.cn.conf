# ECS edge only. FRP port 18087 tunnels to the LAN dashboard on 127.0.0.1:5013.
server {
    listen 80;
    server_name xhs.red-magic.cn;
    return 301 https://xhs.red-magic.cn$request_uri;
}
server {
    listen 443 ssl http2;
    server_name xhs.red-magic.cn;
    ssl_certificate /etc/nginx/ssl/red-magic.cn/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/red-magic.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    client_max_body_size 22m;
    location / {
        proxy_pass http://127.0.0.1:18087;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
    }
}
