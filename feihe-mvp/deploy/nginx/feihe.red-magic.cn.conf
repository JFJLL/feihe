# Legacy dashboard origin. Install only after xhs.red-magic.cn is healthy.
server {
    listen 80;
    server_name feihe.red-magic.cn;
    return 308 https://xhs.red-magic.cn$request_uri;
}
server {
    listen 443 ssl http2;
    server_name feihe.red-magic.cn;
    ssl_certificate /etc/nginx/ssl/red-magic.cn/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/red-magic.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    return 308 https://xhs.red-magic.cn$request_uri;
}
