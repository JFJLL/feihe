# feihe 社媒增长中台 nginx 配置（参照 redbase.red-magic.cn.conf）
# 上游：本机 vinext start（PORT=5013），同时提供前端静态资源和 /api
# 生产启动（与本配置对应）：pnpm start:prod
# 1. 强制 HTTP 跳 HTTPS
server {
    listen 80;
    server_name feihe.red-magic.cn;
    return 301 https://$host$request_uri;
}
# 2. HTTPS 核心服务
server {
    listen 443 ssl;
    server_name feihe.red-magic.cn;
    # 复用通配符证书
    ssl_certificate     /etc/nginx/ssl/red-magic.cn/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/red-magic.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    client_max_body_size 200M;
    # Node 服务同时提供前端静态资源和 /api
    location / {
        proxy_pass http://127.0.0.1:5013;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;
    }
}
